<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picar Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <h1>Picar Console</h1>
      <label class="field">
        <span>Case directory</span>
        <input id="caseDir" type="text" spellcheck="false">
      </label>
      <div class="actions">
        <button id="loadCase" type="button">Load Case</button>
        <button id="fitView" type="button">Fit</button>
      </div>
      <section class="dropzone" id="dropzone">
        <input id="fileInput" type="file" multiple>
        <strong>Drop files here</strong>
        <span>xgrid/ygrid/zgrid.dat or unstruc_surface_in.dat</span>
      </section>
      <section>
        <h2>Scene Layers</h2>
        <div class="layer-list">
          <label><input id="showSurfacePoints" type="checkbox" checked> surface points</label>
          <label><input id="showSurfaceLines" type="checkbox"> surface triangles</label>
          <label><input id="showMeshBounds" type="checkbox" checked> mesh boundary</label>
          <label><input id="showDenseRegion" type="checkbox" checked> dense region</label>
          <label><input id="showFullMesh" type="checkbox"> sampled grid</label>
          <label><input id="showAxes" type="checkbox" checked> axes and ticks</label>
        </div>
      </section>
      <section>
        <h2>Commands</h2>
        <pre id="commands"></pre>
      </section>
    </aside>
    <section class="stage">
      <header class="toolbar">
        <div>
          <strong id="title">Mesh + Geometry</strong>
          <span id="subtitle">ready</span>
        </div>
        <div class="toolbar-actions">
          <button id="topView" type="button">Top</button>
          <button id="isoView" type="button">ISO</button>
        </div>
      </header>
      <canvas id="viewport"></canvas>
      <footer class="status">
        <pre id="stats"></pre>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
